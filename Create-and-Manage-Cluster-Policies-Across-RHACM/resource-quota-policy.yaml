apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: resource-quota-policy
  namespace: policy-management
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.DS Data Security
    policy.open-cluster-management.io/controls: PR.DS-4
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: resource-quota-config
        spec:
          remediationAction: enforce
          severity: low
          namespaceSelector:
            include:
              - production
              - development
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ResourceQuota
                metadata:
                  name: compute-quota
                  namespace: production
                spec:
                  hard:
                    requests.cpu: "4"
                    requests.memory: 8Gi
                    limits.cpu: "8"
                    limits.memory: 16Gi
                    persistentvolumeclaims: "10"
                    pods: "20"
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: ResourceQuota
                metadata:
                  name: compute-quota
                  namespace: development
                spec:
                  hard:
                    requests.cpu: "2"
                    requests.memory: 4Gi
                    limits.cpu: "4"
                    limits.memory: 8Gi
                    persistentvolumeclaims: "5"
                    pods: "10"
