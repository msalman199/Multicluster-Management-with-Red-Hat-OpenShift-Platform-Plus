apiVersion: v1
kind: Pod
metadata:
  name: test-pod-production
  namespace: production
  labels:
    app: test-app
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 2000
  containers:
    - name: nginx
      image: nginx:latest
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop:
            - ALL
      ports:
        - containerPort: 8080
      volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: var-cache
          mountPath: /var/cache/nginx
        - name: var-run
          mountPath: /var/run
  volumes:
    - name: tmp
      emptyDir: {}
    - name: var-cache
      emptyDir: {}
    - name: var-run
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-default
  namespace: default
  labels:
    app: test-app
spec:
  containers:
    - name: curl
      image: curlimages/curl:latest
      command: ["/bin/sh"]
      args: ["-c", "sleep 3600"]
