apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web-app
  namespace: demo-app
  labels:
    app: demo-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-web-app
  template:
    metadata:
      labels:
        app: demo-web-app
    spec:
      containers:
      - name: web-app
        image: nginx:1.21
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: demo-web-app-service
  namespace: demo-app
spec:
  selector:
    app: demo-web-app
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
