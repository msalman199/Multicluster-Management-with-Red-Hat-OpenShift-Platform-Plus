apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  name: rhacm-alertmanager
  namespace: rhacm-observability
  labels:
    app: rhacm-alertmanager
spec:
  replicas: 1
  serviceAccountName: alertmanager-rhacm
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
  resources:
    requests:
      memory: 200Mi
      cpu: 100m
    limits:
      memory: 500Mi
      cpu: 500m
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
