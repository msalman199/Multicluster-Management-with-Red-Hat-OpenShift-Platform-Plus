apiVersion: monitoring.coreos.com/v1
kind: Prometheus
metadata:
  name: rhacm-prometheus
  namespace: rhacm-observability
  labels:
    app: rhacm-prometheus
spec:
  replicas: 1
  retention: 30d
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
  serviceAccountName: prometheus-rhacm
  serviceMonitorSelector:
    matchLabels:
      team: rhacm
  ruleSelector:
    matchLabels:
      team: rhacm
  resources:
    requests:
      memory: 400Mi
      cpu: 100m
    limits:
      memory: 2Gi
      cpu: 1000m
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
