apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager-rhacm
  namespace: rhacm-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alertmanager-rhacm
rules:
- apiGroups: [""]
  resources:
  - nodes
  - services
  - endpoints
  - pods
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alertmanager-rhacm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alertmanager-rhacm
subjects:
- kind: ServiceAccount
  name: alertmanager-rhacm
  namespace: rhacm-observability
