apiVersion: integreatly.org/v1alpha1
kind: Grafana
metadata:
  name: rhacm-grafana
  namespace: rhacm-observability
  labels:
    app: rhacm-grafana
spec:
  ingress:
    enabled: true
    hostname: grafana-rhacm-observability.apps.cluster.local
  config:
    auth:
      disable_login_form: false
      disable_signout_menu: false
    auth.anonymous:
      enabled: true
      org_role: Viewer
    log:
      mode: console
      level: warn
    security:
      admin_user: admin
      admin_password: admin123
  dashboardLabelSelector:
    - matchExpressions:
        - key: app
          operator: In
          values:
            - rhacm-grafana
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
