apiVersion: apps/v1
kind: Deployment
metadata:
  name: non-compliant-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: non-compliant-app
  template:
    metadata:
      labels:
        app: non-compliant-app
    spec:
      containers:
      - name: app
        image: nginx:latest
        ports:
        - containerPort: 80
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: true
          readOnlyRootFilesystem: false
        resources: {}
      securityContext:
        runAsUser: 0
        fsGroup: 0
