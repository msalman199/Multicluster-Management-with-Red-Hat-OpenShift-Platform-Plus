apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rhacs-network-policy
  namespace: stackrox
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: stackrox
    - namespaceSelector:
        matchLabels:
          name: openshift-monitoring
  - from: []
    ports:
    - protocol: TCP
      port: 8443
    - protocol: TCP
      port: 9443
  egress:
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 8443
    - protocol: UDP
      port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: default
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
