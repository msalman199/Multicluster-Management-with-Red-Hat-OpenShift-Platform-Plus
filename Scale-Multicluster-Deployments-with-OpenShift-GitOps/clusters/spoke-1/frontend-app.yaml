apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-spoke-1
  namespace: openshift-gitops
  labels:
    cluster: spoke-1
    environment: development
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR-USERNAME/multicluster-scaling.git
    targetRevision: main
    path: applications/frontend/overlays/development
  destination:
    server: https://kubernetes.default.svc
    namespace: frontend-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
