# Create file: dev-app-deployment.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-sample-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: HEAD
    path: guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: apps.open-cluster-management.io/v1
kind: PlacementRule
metadata:
  name: dev-clusters-placement
  namespace: argocd
spec:
  clusterSelector:
    matchLabels:
      environment: development
