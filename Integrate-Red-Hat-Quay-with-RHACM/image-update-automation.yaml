apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quay-image-updater
  namespace: rhacm-image-management
spec:
  project: default
  source:
    repoURL: https://github.com/example/quay-image-configs
    targetRevision: HEAD
    path: image-configs
  destination:
    server: https://kubernetes.default.svc
    namespace: quay-integration
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: image-update-config
  namespace: rhacm-image-management
data:
  update-policy.yaml: |
    imageUpdatePolicy:
      schedule: "0 2 * * *"  # Daily at 2 AM
      registries:
        - quay-registry.apps.cluster.local
      updateStrategy: rolling
      approvalRequired: true
      notifications:
        slack:
          webhook: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
          channel: "#devops-alerts"
