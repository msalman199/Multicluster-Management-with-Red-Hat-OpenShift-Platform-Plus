apiVersion: apps/v1
kind: Deployment
metadata:
  name: quay-sample-app
  namespace: quay-integration
  labels:
    app: quay-sample-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: quay-sample-app
  template:
    metadata:
      labels:
        app: quay-sample-app
    spec:
      imagePullSecrets:
        - name: quay-registry-secret
      containers:
        - name: sample-app
          image: quay-registry.apps.cluster.local/admin/sample-nginx:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
---
apiVersion: v1
kind: Service
metadata:
  name: quay-sample-app-service
  namespace: quay-integration
spec:
  selector:
    app: quay-sample-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
